services:
  vllm-glm-47-flash:
    image: local/vllm:26.07-xg024
    container_name: vllm-glm-47-flash
    hostname: vllm-glm-47-flash
    ports:
      - "8000:8000"
    environment:
      - CUDA_MANAGED_FORCE_DEVICE_ALLOC=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - VLLM_USE_V1=1
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16gb
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    # reasoning-parser separates chain-of-thought from content (GLM is a reasoning model).
    # guidance backend avoids the broken xgrammar normalize_tool_choice import in this image.
    command: >
      vllm serve GadflyII/GLM-4.7-Flash-NVFP4
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --max-num-seqs 128
      --download-dir /root/.cache/huggingface
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm47
      --structured-outputs-config.backend guidance
      --trust-remote-code
      --served-model-name glm-4.7-flash
    networks:
      - vllm_network
volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
networks:
  vllm_network:
    name: vllm_network
    driver: bridge
    external: true
