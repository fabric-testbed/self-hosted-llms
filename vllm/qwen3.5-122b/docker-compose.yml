services:
  vllm-qwen35-122b:
    image: local/vllm:26.07-xg024
    container_name: vllm-qwen35-122b
    hostname: vllm-qwen35-122b
    ports:
      - "8000:8000"
    environment:
      - CUDA_MANAGED_FORCE_DEVICE_ALLOC=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - VLLM_USE_V1=1
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16gb
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    # Qwen3.5-122B-A10B is a hybrid Mamba model: vLLM's Mamba cache align mode
    # requires block_size (4176) <= max-num-batched-tokens, which defaults to 2048.
    command: >
      vllm serve nvidia/Qwen3.5-122B-A10B-NVFP4
      --quantization modelopt_fp4
      --kv-cache-dtype fp8
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --max-num-seqs 64
      --download-dir /root/.cache/huggingface
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --trust-remote-code
      --served-model-name qwen3.5-122b
    networks:
      - vllm_network
volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
networks:
  vllm_network:
    name: vllm_network
    driver: bridge
    external: true
